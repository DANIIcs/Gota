# Gota — Xcode project definition (XcodeGen).
# Generate the .xcodeproj with:  xcodegen
# The .xcodeproj is NOT committed: this file is the source of truth.

name: Gota

options:
  bundleIdPrefix: pe.danielc        # change to something unique to you (e.g. io.github.<your-user>)
  deploymentTarget:
    macOS: "26.0"                   # Liquid Glass (SwiftUI glassEffect) needs macOS 26+
  createIntermediateGroups: true
  # The Xcode the project is checked against: older values make Xcode show "Update to recommended settings".
  xcodeVersion: "27.1"
  developmentLanguage: es

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES
    # Xcode's recommended settings for current projects.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
  configs:
    # Hardened runtime only for Release: with ad-hoc signing in Debug it would stop the tests from loading.
    Release:
      ENABLE_HARDENED_RUNTIME: YES

targets:
  Gota:
    type: application
    platform: macOS
    sources:
      - path: Gota
      # Carlito and Caladea (OFL), for the docxide engine: kept as a folder, Contents/Resources/Fonts.
      - path: Engines/Fonts
        type: folder
        buildPhase: resources
      # Their licenses travel with the app, as Apache-2.0 and the OFL require.
      - path: Engines/Licenses
        type: folder
        buildPhase: resources
    postBuildScripts:
      # The bundled .docx engine (Engines/docxide/build.sh). Optional: without Rust there is no binary
      # and Gota falls back to LibreOffice. Signed here, before Xcode seals the app.
      - name: Bundle docxide engine
        basedOnDependencyAnalysis: false
        script: |
          engine="$SRCROOT/build/engines/docxide-pdf"
          if [ -f "$engine" ]; then
            dest="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/docxide-pdf"
            cp "$engine" "$dest"
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime --timestamp=none "$dest"
          else
            echo "note: build/engines/docxide-pdf not found (run Engines/docxide/build.sh); .docx will use LibreOffice"
          fi
    info:
      path: Gota/Support/Info.plist
      properties:
        CFBundleDisplayName: Gota
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true                         # menu bar app: no Dock icon
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "MIT License"
        NSAppleEventsUsageDescription: "Gota usa Microsoft Word, si está instalado, para convertir documentos a PDF con el formato exacto."
    entitlements:
      path: Gota/Support/Gota.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GOTA_BUNDLE_ID)
        PRODUCT_NAME: Gota
        # The docxide script reads build/engines, outside what script sandboxing allows by default.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Target-level settings beat the xcconfig, so signing goes through variables Local.xcconfig can override.
        CODE_SIGN_IDENTITY: $(GOTA_SIGN_IDENTITY)
        CODE_SIGN_STYLE: $(GOTA_SIGN_STYLE)
        DEVELOPMENT_TEAM: $(GOTA_TEAM)

  GotaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GotaTests
    dependencies:
      - target: Gota
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GOTA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: $(GOTA_SIGN_IDENTITY)
        CODE_SIGN_STYLE: $(GOTA_SIGN_STYLE)
        DEVELOPMENT_TEAM: $(GOTA_TEAM)

schemes:
  Gota:
    build:
      targets:
        Gota: all
        GotaTests: [test]
    test:
      targets:
        - GotaTests
